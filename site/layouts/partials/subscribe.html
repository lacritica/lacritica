{{- /* Posts to a Google Form (params.newsletter in hugo.toml). Google's reply
       goes to a hidden iframe so the reader stays on the site; once it loads
       we move on to /gracias/. */ -}}
{{- with site.Params.newsletter }}
{{- if and .form_id .email_entry }}
<form
  name="newsletter"
  action="https://docs.google.com/forms/d/e/{{ .form_id }}/formResponse"
  method="POST"
  target="newsletter-sink"
  class="subscribe-form"
  data-newsletter
>
  <input
    type="email"
    name="{{ .email_entry }}"
    placeholder="Tu correo electrónico"
    required
    class="subscribe-input"
  >

  <button type="submit" class="subscribe-button">
    Suscribirse
  </button>
</form>
<iframe name="newsletter-sink" class="hidden" aria-hidden="true" tabindex="-1"></iframe>

<script>
  (function () {
    var form = document.querySelector("[data-newsletter]");
    var sink = document.querySelector('iframe[name="newsletter-sink"]');
    var sent = false;
    form.addEventListener("submit", function () { sent = true; });
    sink.addEventListener("load", function () {
      if (sent) window.location.href = "{{ "gracias/" | relURL }}";
    });
  })();
</script>
{{- end }}
{{- end }}

<style>
  .hidden {
  position: absolute;
  left: -9999px;
}

/* Subscribe form container */
.subscribe-form {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  max-width: 420px;
  
  margin-left: 0rem;
  z-index: 1001;
}

/* Email input */
.subscribe-input {
  flex: 1;
  padding: 0.6rem 0.7rem;
  font-size: 0.95rem;
  border: 1px solid var(--divider-color, #ccc);
  border-radius: 4px;
  font-family: inherit;
}

/* Focus state */
.subscribe-input:focus {
  outline: none;
  border-color: #000;
}

/* Button */
.subscribe-button {
  padding: 0.6rem 0.9rem;
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--primary-dark);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* Hover */
.subscribe-button:hover {
  background: #222;
}

/* Mobile stacking */
@media (max-width: 480px) {
  .subscribe-form {
    flex-direction: column;
    align-items: stretch;
  }

  .subscribe-button {
    width: 100%;
  }
}

/* Honeypot */
.hidden {
  position: absolute;
  left: -9999px;
}
</style>
